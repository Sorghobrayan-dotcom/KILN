<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln — the forge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="back" href="/">&larr; Kiln</a>
  <h1>The forge</h1>
  <p class="tagline">Brief it, judge it, seal it. The second time costs nothing.</p>
</header>

<section class="panel">
  <form id="brief-form">
    <div class="row">
      <label>Project <input id="project" value="providence" required></label>
      <label>Asset kind <select id="kind"></select></label>
      <label>How many <input id="count" type="number" min="1" max="12" value="3"></label>
      <label>Token <input id="token" type="password" value="kiln-demo-2026"></label>
    </div>
    <label>Brief
      <textarea id="description" rows="2" required>It is written. You will not pass this gate tonight.</textarea>
    </label>
    <button id="go">Generate</button>
  </form>
  <p id="status" class="status"></p>
  <p id="savings" class="muted"></p>
</section>

<section class="panel">
  <div class="row spread">
    <h2>Staging</h2>
    <span>
      <button id="refresh" class="ghost">Refresh</button>
      <button id="publish">Seal a version</button>
    </span>
  </div>
  <div id="grid"></div>
  <p id="empty" class="muted">Nothing staged yet. Send a brief above.</p>
</section>

<dialog id="prov">
  <h2>Provenance</h2>
  <div id="prov-body"></div>
  <button onclick="document.getElementById('prov').close()">Close</button>
</dialog>

<script src="app.js"></script>
</body>
</html>
