<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln — the forge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%233b5bdb'/%3E%3Cline x1='4' y1='3' x2='20' y2='3' stroke='%23fff' stroke-width='2.2' stroke-linecap='square'/%3E%3Cline x1='12' y1='3' x2='12' y2='15' stroke='%23fff' stroke-width='1.54'/%3E%3Cpath d='M 12 15 L 16.2 18.4 L 12 21.5 L 7.8 18.4 Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="back" href="/">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <line x1="4" y1="3" x2="20" y2="3" stroke="currentColor" stroke-width="1.9" stroke-linecap="square"/>
      <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="1.33"/>
      <path d="M 12 15 L 16.2 18.4 L 12 21.5 L 7.8 18.4 Z" fill="currentColor"/>
    </svg>
    Kiln
  </a>
  <h1>The forge</h1>
  <p class="tagline">Brief it, judge it, seal it. The second time costs nothing.</p>
</header>

<section class="panel">
  <form id="brief-form">
    <div class="row">
      <label>Project <input id="project" value="providence" required></label>
      <label>Asset kind <select id="kind"></select></label>
      <label>How many <input id="count" type="number" min="1" max="12" value="3"></label>
      <label>Token <input id="token" type="password" value="kiln-demo-2026"></label>
    </div>
    <label>Brief
      <textarea id="description" rows="2" required>It is written. You will not pass this gate tonight.</textarea>
    </label>
    <button id="go">Generate</button>
  </form>
  <p id="status" class="status"></p>
  <p id="savings" class="muted"></p>
</section>

<section class="panel">
  <div class="row spread">
    <h2>Staging</h2>
    <span>
      <button id="refresh" class="ghost">Refresh</button>
      <button id="publish">Seal a version</button>
    </span>
  </div>
  <div id="grid"></div>
  <p id="empty" class="muted">Nothing staged yet. Send a brief above.</p>
</section>

<dialog id="prov">
  <h2>Provenance</h2>
  <div id="prov-body"></div>
  <button onclick="document.getElementById('prov').close()">Close</button>
</dialog>

<script src="app.js"></script>
</body>
</html>
